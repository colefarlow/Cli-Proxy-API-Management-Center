name: ProxyAtelier
options:
  bundleIdPrefix: com.colefarlow
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ProxyAtelier/Info.plist
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    PRODUCT_BUNDLE_IDENTIFIER: com.colefarlow.proxyatelier
    PRODUCT_NAME: Proxy Atelier
    COMBINE_HIDPI_IMAGES: YES
targets:
  ProxyAtelier:
    type: application
    platform: macOS
    sources:
      - path: ProxyAtelier
        excludes: ['*.py', '*.icns', 'Info.plist']
      - path: ../dist/index.html
        buildPhase: resources
      - path: ProxyAtelier/remote_request.py
        buildPhase: resources
      - path: ProxyAtelier/AppIcon.icns
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
